<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#16a34a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#065f46;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="circleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#15803d;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#14532d;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Circle background -->
  <circle cx="16" cy="16" r="15" fill="url(#circleGrad)" />
  <!-- Leaf shape -->
  <path d="M16 5 C10 9, 7 15, 7 19 C7 23, 10 27, 16 27 C22 27, 25 23, 25 19 C25 15, 22 9, 16 5Z" fill="url(#leafGrad)" opacity="0.9"/>
  <!-- Leaf vein center -->
  <line x1="16" y1="8" x2="16" y2="25" stroke="#ffffff" stroke-width="1.2" opacity="0.7"/>
  <!-- Leaf veins left -->
  <line x1="16" y1="13" x2="11" y2="16" stroke="#ffffff" stroke-width="0.8" opacity="0.5"/>
  <line x1="16" y1="17" x2="10.5" y2="20" stroke="#ffffff" stroke-width="0.8" opacity="0.5"/>
  <!-- Leaf veins right -->
  <line x1="16" y1="13" x2="21" y2="16" stroke="#ffffff" stroke-width="0.8" opacity="0.5"/>
  <line x1="16" y1="17" x2="21.5" y2="20" stroke="#ffffff" stroke-width="0.8" opacity="0.5"/>
  <!-- B letter subtle -->
  <text x="16" y="21" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="10" fill="#ffffff" opacity="0.85">B</text>
</svg>
